<!DOCTYPE html>
<html>
<head>
    <title>Static Web Page</title>
</head>

<body>

<!-- Basic Tags -->
<h1>Welcome to My Web Page</h1>
<p>This is a paragraph using basic HTML tags.</p>
<br>

<!-- Heading Tags -->
<h1>Heading 1</h1>
<h2>Heading 2</h2>
<h3>Heading 3</h3>
<h4>Heading 4</h4>
<h5>Heading 5</h5>
<h6>Heading 6</h6>

<hr>

<!-- Ordered List -->
<h3>Ordered List</h3>
<ol>
    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>
</ol>

<!-- Unordered List -->
<h3>Unordered List</h3>
<ul>
    <li>Apple</li>
    <li>Mango</li>
    <li>Orange</li>
</ul>

<hr>

<!-- Textbox and Buttons -->
<h3>Login Form</h3>

<form>
    Name:
    <input type="text" placeholder="Enter Name"><br><br>

    Password:
    <input type="password" placeholder="Enter Password"><br><br>

    <input type="submit" value="Login">
    <input type="reset" value="Clear">
</form>

</body>
</html>
