<!DOCTYPE html>
<html>
<head>
<title>Node.js & NPM Demo</title>

<style>

body{
    background-image:url("bg.jpg");
    background-repeat:no-repeat;
    background-size:cover;
    cursor:crosshair;
}

table{
    width:60%;
    border-collapse:collapse;
}

td{
    padding:15px;
    color:white;
}

.red{background:red;}
.blue{background:blue;}
.green{background:green;}

.layer{
    position:absolute;
    top:50px;
    left:50px;
    z-index:2;
    background:black;
    color:white;
    padding:10px;
}

a{
    text-decoration:none;
    color:yellow;
}

a:hover{
    color:white;
}

</style>
</head>

<body>

<h2>Node.js & NPM Demo Page</h2>

<table border="1">
<tr>
<td class="red">Node.js</td>
<td class="blue">NPM</td>
<td class="green">Installation</td>
</tr>
</table>

<div class="layer">
Layered Element using z-index
</div>

<br><br>
<a href="#">Styled Link Example</a>

</body>
</html>
