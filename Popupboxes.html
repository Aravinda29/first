<!DOCTYPE html>
<html>
<head>
<title>Popup Boxes</title>
</head>

<body>

<h2>JavaScript Popup Boxes</h2>

<button onclick="showAlert()">Alert Box</button>
<button onclick="showConfirm()">Confirm Box</button>
<button onclick="showPrompt()">Prompt Box</button>

<p id="output"></p>

<script>

// Alert Box
function showAlert() {
    alert("This is Alert Box");
}

// Confirm Box
function showConfirm() {
    let result = confirm("Are you sure?");
    
    if(result)
        document.getElementById("output").innerHTML="You pressed OK";
    else
        document.getElementById("output").innerHTML="You pressed Cancel";
}

// Prompt Box
function showPrompt() {
    let name = prompt("Enter your name:");
    document.getElementById("output").innerHTML="Hello " + name;
}

</script>

</body>
</html>
